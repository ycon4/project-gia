<svg width="100%" viewBox="0 0 680 1260" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>GIA chatbot pipeline flowchart</title>
  <desc>Eight-step flowchart showing how GIA processes a user query through intent parsing, data retrieval, computation, prompt augmentation, and UI rendering.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ── User Input ─────────────────────────────────────────── -->
  <g>
    <rect x="190" y="20" width="300" height="72" rx="8" stroke-width="0.5" fill="rgb(68,68,65)" stroke="rgb(180,178,169)"/>
    <text x="340" y="40"  text-anchor="middle" dominant-baseline="central" fill="rgb(211,209,199)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="500">User input</text>
    <text x="340" y="58"  text-anchor="middle" dominant-baseline="central" fill="rgb(180,178,169)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">Natural language query</text>
    <text x="340" y="76"  text-anchor="middle" dominant-baseline="central" fill="rgb(155,153,143)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-style="italic">User types a question into GIA's chat interface</text>
  </g>

  <!-- Arrow 0→1 -->
  <line x1="340" y1="92" x2="340" y2="108" marker-end="url(#arrow)" stroke="rgb(156,154,146)" stroke-width="1.5" fill="none"/>

  <!-- ── Step 1: LLM Intent Parsing ────────────────────────── -->
  <g>
    <rect x="100" y="108" width="480" height="100" rx="8" stroke-width="0.5" fill="rgb(60,52,137)" stroke="rgb(175,169,236)"/>
    <text x="340" y="130" text-anchor="middle" dominant-baseline="central" fill="rgb(206,203,246)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="500">Step 1 — LLM intent parsing</text>
    <text x="340" y="150" text-anchor="middle" dominant-baseline="central" fill="rgb(175,169,236)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">parseQueryWithLLM() → Groq (llama-3.3-70b) returns structured JSON intent</text>
    <text x="340" y="168" text-anchor="middle" dominant-baseline="central" fill="rgb(175,169,236)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">Fallback: keyword/regex via parseQuery()</text>
    <text x="340" y="189" text-anchor="middle" dominant-baseline="central" fill="rgb(148,143,210)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-style="italic">The AI reads the question and maps it to data fields and filter conditions</text>
  </g>

  <!-- Arrow 1→branch -->
  <line x1="340" y1="208" x2="340" y2="228" marker-end="url(#arrow)" stroke="rgb(156,154,146)" stroke-width="1.5" fill="none"/>

  <!-- Branch label -->
  <text x="340" y="242" text-anchor="middle" dominant-baseline="central" fill="rgb(194,192,182)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">isConversational?</text>

  <!-- Left branch: yes (conversational) — routed at x=20, left of side nodes -->
  <line x1="220" y1="252" x2="20"  y2="252" stroke="rgba(222,220,209,0.4)" stroke-width="1"/>
  <line x1="20"  y1="252" x2="20"  y2="882" stroke="rgba(222,220,209,0.4)" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="20"  y1="882" x2="190" y2="882" marker-end="url(#arrow)" stroke="rgb(156,154,146)" stroke-width="1.5" fill="none"/>
  <text x="120"  y="265" text-anchor="middle" dominant-baseline="central" fill="rgb(194,192,182)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">yes</text>
  <text x="46"   y="872" text-anchor="middle" dominant-baseline="central" fill="rgb(194,192,182)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11">direct</text>

  <!-- Right branch: no (data query) -->
  <line x1="460" y1="252" x2="540" y2="252" stroke="rgba(222,220,209,0.4)" stroke-width="1"/>
  <line x1="540" y1="252" x2="540" y2="280" stroke="rgba(222,220,209,0.4)" stroke-width="1"/>
  <line x1="540" y1="280" x2="490" y2="280" stroke="rgba(222,220,209,0.4)" stroke-width="1"/>
  <text x="572"  y="264" text-anchor="middle" dominant-baseline="central" fill="rgb(194,192,182)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">no</text>

  <!-- ── Step 2: Data Retrieval ─────────────────────────────── -->
  <g>
    <rect x="190" y="280" width="300" height="76" rx="8" stroke-width="0.5" fill="rgb(8,80,65)" stroke="rgb(93,202,165)"/>
    <text x="340" y="300" text-anchor="middle" dominant-baseline="central" fill="rgb(159,225,203)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="500">Step 2 — Data retrieval</text>
    <text x="340" y="320" text-anchor="middle" dominant-baseline="central" fill="rgb(93,202,165)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">Firebase Firestore — docs pre-loaded in memory</text>
    <text x="340" y="340" text-anchor="middle" dominant-baseline="central" fill="rgb(72,170,138)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-style="italic">Records pre-loaded from Firestore into browser memory</text>
  </g>

  <!-- Arrow 2→3 -->
  <line x1="340" y1="356" x2="340" y2="374" marker-end="url(#arrow)" stroke="rgb(156,154,146)" stroke-width="1.5" fill="none"/>

  <!-- ── Step 3: Field Normalization ───────────────────────── -->
  <g>
    <rect x="190" y="374" width="300" height="76" rx="8" stroke-width="0.5" fill="rgb(8,80,65)" stroke="rgb(93,202,165)"/>
    <text x="340" y="394" text-anchor="middle" dominant-baseline="central" fill="rgb(159,225,203)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="500">Step 3 — Field normalization</text>
    <text x="340" y="414" text-anchor="middle" dominant-baseline="central" fill="rgb(93,202,165)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">Canonicalize fields, colleges, academic year</text>
    <text x="340" y="434" text-anchor="middle" dominant-baseline="central" fill="rgb(72,170,138)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-style="italic">Standardizes field names, colleges, and year scope</text>
  </g>

  <!-- Arrow 3→4 -->
  <line x1="340" y1="450" x2="340" y2="468" marker-end="url(#arrow)" stroke="rgb(156,154,146)" stroke-width="1.5" fill="none"/>

  <!-- ── Step 4: Deterministic Computation ─────────────────── -->
  <g>
    <rect x="190" y="468" width="300" height="92" rx="8" stroke-width="0.5" fill="rgb(8,80,65)" stroke="rgb(93,202,165)"/>
    <text x="340" y="488" text-anchor="middle" dominant-baseline="central" fill="rgb(159,225,203)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="500">Step 4 — Deterministic computation</text>
    <text x="340" y="508" text-anchor="middle" dominant-baseline="central" fill="rgb(93,202,165)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">computeMultiFilter() / computeForDocs()</text>
    <text x="340" y="526" text-anchor="middle" dominant-baseline="central" fill="rgb(93,202,165)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">Routes by query type; sex breakdown optional</text>
    <text x="340" y="545" text-anchor="middle" dominant-baseline="central" fill="rgb(72,170,138)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-style="italic">Pure JavaScript counts exact matches — no AI involved, no hallucination</text>
  </g>

  <!-- Arrow 4→5 -->
  <line x1="340" y1="560" x2="340" y2="578" marker-end="url(#arrow)" stroke="rgb(156,154,146)" stroke-width="1.5" fill="none"/>

  <!-- ── Step 5: Structured Text Block ─────────────────────── -->
  <g>
    <rect x="190" y="578" width="300" height="76" rx="8" stroke-width="0.5" fill="rgb(8,80,65)" stroke="rgb(93,202,165)"/>
    <text x="340" y="598" text-anchor="middle" dominant-baseline="central" fill="rgb(159,225,203)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="500">Step 5 — Structured text block</text>
    <text x="340" y="618" text-anchor="middle" dominant-baseline="central" fill="rgb(93,202,165)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">formatResultForAI() — locked computed data</text>
    <text x="340" y="638" text-anchor="middle" dominant-baseline="central" fill="rgb(72,170,138)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-style="italic">Exact counts packed into a block the AI cannot alter</text>
  </g>

  <!-- Long arrow Step 5 → Step 6 (passes between side nodes) -->
  <line x1="340" y1="654" x2="340" y2="848" marker-end="url(#arrow)" stroke="rgb(156,154,146)" stroke-width="1.5" fill="none"/>

  <!-- ── Side Node A: prompt.txt ─────────────────────────── -->
  <g>
    <rect x="30" y="672" width="155" height="92" rx="8" stroke-width="0.5" fill="rgb(99,56,6)" stroke="rgb(239,159,39)"/>
    <text x="107" y="692" text-anchor="middle" dominant-baseline="central" fill="rgb(250,199,117)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="500">prompt.txt</text>
    <text x="107" y="710" text-anchor="middle" dominant-baseline="central" fill="rgb(239,159,39)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11">GIA persona &amp; behavior</text>
    <text x="107" y="727" text-anchor="middle" dominant-baseline="central" fill="rgb(239,159,39)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11">(system prompt)</text>
    <text x="107" y="746" text-anchor="middle" dominant-baseline="central" fill="rgb(200,132,32)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-style="italic">Loaded once at server start</text>
  </g>

  <!-- Arrow: prompt.txt → Step 6 left side -->
  <line x1="107" y1="764" x2="107" y2="858" stroke="rgba(222,220,209,0.4)" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="107" y1="858" x2="190" y2="858" marker-end="url(#arrow)" stroke="rgb(156,154,146)" stroke-width="1.5" fill="none"/>

  <!-- ── Side Node B: INSTRUCTIONS ──────────────────────── -->
  <g>
    <rect x="495" y="672" width="160" height="92" rx="8" stroke-width="0.5" fill="rgb(99,56,6)" stroke="rgb(239,159,39)"/>
    <text x="575" y="692" text-anchor="middle" dominant-baseline="central" fill="rgb(250,199,117)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="500">INSTRUCTIONS</text>
    <text x="575" y="710" text-anchor="middle" dominant-baseline="central" fill="rgb(239,159,39)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11">Output format rules</text>
    <text x="575" y="727" text-anchor="middle" dominant-baseline="central" fill="rgb(239,159,39)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11">(inline in enrichedMessage)</text>
    <text x="575" y="746" text-anchor="middle" dominant-baseline="central" fill="rgb(200,132,32)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-style="italic">Appended per data query</text>
  </g>

  <!-- Arrow: INSTRUCTIONS → Step 6 right side -->
  <line x1="575" y1="764" x2="575" y2="858" stroke="rgba(222,220,209,0.4)" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="575" y1="858" x2="490" y2="858" marker-end="url(#arrow)" stroke="rgb(156,154,146)" stroke-width="1.5" fill="none"/>

  <!-- ── Step 6: Prompt Augmentation → LLM Narration ───── -->
  <g>
    <rect x="100" y="848" width="480" height="100" rx="8" stroke-width="0.5" fill="rgb(60,52,137)" stroke="rgb(175,169,236)"/>
    <text x="340" y="870" text-anchor="middle" dominant-baseline="central" fill="rgb(206,203,246)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="500">Step 6 — Prompt augmentation → LLM narration</text>
    <text x="340" y="890" text-anchor="middle" dominant-baseline="central" fill="rgb(175,169,236)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">enrichedMessage = computed data + user question + inline rules</text>
    <text x="340" y="908" text-anchor="middle" dominant-baseline="central" fill="rgb(175,169,236)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">Groq (llama-3.3-70b) narrates only — cannot change numbers</text>
    <text x="340" y="928" text-anchor="middle" dominant-baseline="central" fill="rgb(148,143,210)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-style="italic">AI receives merged prompt and writes a readable reply; numbers are fixed</text>
  </g>

  <!-- Arrow 6→7 -->
  <line x1="340" y1="948" x2="340" y2="966" marker-end="url(#arrow)" stroke="rgb(156,154,146)" stroke-width="1.5" fill="none"/>

  <!-- ── Step 7: Post-processing ────────────────────────── -->
  <g>
    <rect x="190" y="966" width="300" height="76" rx="8" stroke-width="0.5" fill="rgb(113,43,19)" stroke="rgb(240,153,123)"/>
    <text x="340" y="986"  text-anchor="middle" dominant-baseline="central" fill="rgb(245,196,179)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="500">Step 7 — Post-processing</text>
    <text x="340" y="1006" text-anchor="middle" dominant-baseline="central" fill="rgb(240,153,123)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">stripInterpretiveSentences() — remove speculation</text>
    <text x="340" y="1026" text-anchor="middle" dominant-baseline="central" fill="rgb(200,120,98)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-style="italic">Removes 'this suggests...' style phrases from the AI reply</text>
  </g>

  <!-- Arrow 7→8 -->
  <line x1="340" y1="1042" x2="340" y2="1060" marker-end="url(#arrow)" stroke="rgb(156,154,146)" stroke-width="1.5" fill="none"/>

  <!-- ── Step 8: UI Render ───────────────────────────────── -->
  <g>
    <rect x="100" y="1060" width="480" height="100" rx="8" stroke-width="0.5" fill="rgb(68,68,65)" stroke="rgb(180,178,169)"/>
    <text x="340" y="1082" text-anchor="middle" dominant-baseline="central" fill="rgb(211,209,199)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="500">Step 8 — UI render</text>
    <text x="340" y="1102" text-anchor="middle" dominant-baseline="central" fill="rgb(180,178,169)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">Markdown reply + chartData → ChatChart.jsx</text>
    <text x="340" y="1120" text-anchor="middle" dominant-baseline="central" fill="rgb(180,178,169)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">Pie · Stacked bar · Grouped bar · Line — by result shape</text>
    <text x="340" y="1140" text-anchor="middle" dominant-baseline="central" fill="rgb(155,153,143)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-style="italic">Formatted reply shown; chart type auto-selected by result shape</text>
  </g>

  <!-- ── Legend ─────────────────────────────────────────── -->
  <rect x="100" y="1190" width="14" height="14" rx="3" stroke-width="0.5" fill="rgb(60,52,137)" stroke="rgb(175,169,236)"/>
  <text x="120" y="1200" dominant-baseline="central" fill="rgb(194,192,182)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">LLM interaction</text>

  <rect x="220" y="1190" width="14" height="14" rx="3" stroke-width="0.5" fill="rgb(8,80,65)" stroke="rgb(93,202,165)"/>
  <text x="240" y="1200" dominant-baseline="central" fill="rgb(194,192,182)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">Data processing</text>

  <rect x="340" y="1190" width="14" height="14" rx="3" stroke-width="0.5" fill="rgb(99,56,6)" stroke="rgb(239,159,39)"/>
  <text x="360" y="1200" dominant-baseline="central" fill="rgb(194,192,182)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">Instruction sources</text>

  <rect x="480" y="1190" width="14" height="14" rx="3" stroke-width="0.5" fill="rgb(113,43,19)" stroke="rgb(240,153,123)"/>
  <text x="500" y="1200" dominant-baseline="central" fill="rgb(194,192,182)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">Filtering</text>

</svg>
