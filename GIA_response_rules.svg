<svg width="100%" viewBox="0 0 680 598" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>GIA response rules — inline INSTRUCTIONS diagram</title>
  <desc>Focused diagram showing the 8 output-format rules injected as INSTRUCTIONS into every GIA data query, grouped into Data Fidelity, Output Structure, and Format Constraints.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ── Title ─────────────────────────────────────────────── -->
  <g>
    <rect x="60" y="20" width="560" height="64" rx="8" stroke-width="0.5" fill="rgb(68,68,65)" stroke="rgb(180,178,169)"/>
    <text x="340" y="42" text-anchor="middle" dominant-baseline="central" fill="rgb(211,209,199)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="500">Response Rules — Inline INSTRUCTIONS</text>
    <text x="340" y="66" text-anchor="middle" dominant-baseline="central" fill="rgb(180,178,169)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11">One of two rule injections per data query — paired with the System Prompt (prompt.txt)</text>
  </g>

  <!-- ── Two-source header ──────────────────────────────────── -->
  <!-- Left: System Prompt (dimmed — already documented) -->
  <g>
    <rect x="60" y="104" width="246" height="70" rx="8" stroke-width="0.5" fill="rgb(50,50,48)" stroke="rgb(110,108,100)"/>
    <text x="183" y="124" text-anchor="middle" dominant-baseline="central" fill="rgb(140,138,128)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="500">① System Prompt</text>
    <text x="183" y="142" text-anchor="middle" dominant-baseline="central" fill="rgb(110,108,100)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11">prompt.txt — loaded at server start</text>
    <text x="183" y="160" text-anchor="middle" dominant-baseline="central" fill="rgb(110,108,100)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-style="italic">GIA identity · scope · tone · narrative style</text>
  </g>

  <!-- "+" connector -->
  <text x="340" y="139" text-anchor="middle" dominant-baseline="central" fill="rgb(155,153,143)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16">+</text>

  <!-- Right: INSTRUCTIONS (this diagram — highlighted) -->
  <g>
    <rect x="374" y="104" width="246" height="70" rx="8" stroke-width="0.5" fill="rgb(99,56,6)" stroke="rgb(239,159,39)"/>
    <text x="497" y="124" text-anchor="middle" dominant-baseline="central" fill="rgb(250,199,117)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="500">② INSTRUCTIONS ← this diagram</text>
    <text x="497" y="142" text-anchor="middle" dominant-baseline="central" fill="rgb(239,159,39)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11">enrichedMessage — per data query</text>
    <text x="497" y="160" text-anchor="middle" dominant-baseline="central" fill="rgb(200,132,32)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-style="italic">8 output-format rules appended below ↓</text>
  </g>

  <!-- Arrow from INSTRUCTIONS box → Group 1 (L-shape) -->
  <line x1="497" y1="174" x2="497" y2="190" stroke="rgba(222,220,209,0.4)" stroke-width="1" fill="none"/>
  <line x1="497" y1="190" x2="340" y2="190" stroke="rgba(222,220,209,0.4)" stroke-width="1" fill="none"/>
  <line x1="340" y1="190" x2="340" y2="202" marker-end="url(#arrow)" stroke="rgb(156,154,146)" stroke-width="1.5" fill="none"/>

  <!-- ── Group 1: Data Fidelity ────────────────────────────── -->
  <g>
    <rect x="60" y="202" width="560" height="88" rx="8" stroke-width="0.5" fill="rgb(60,52,137)" stroke="rgb(175,169,236)"/>
    <text x="340" y="224" text-anchor="middle" dominant-baseline="central" fill="rgb(206,203,246)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="500">Data Fidelity</text>
    <text x="340" y="244" text-anchor="middle" dominant-baseline="central" fill="rgb(175,169,236)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">Use ONLY the numbers from the COMPUTED DATA block — pre-calculated by JavaScript, not the AI</text>
    <text x="340" y="262" text-anchor="middle" dominant-baseline="central" fill="rgb(175,169,236)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">Never modify, recalculate, or derive any figure independently</text>
    <text x="340" y="280" text-anchor="middle" dominant-baseline="central" fill="rgb(148,143,210)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-style="italic">If a figure is absent from the data, say so — never approximate or infer</text>
  </g>

  <!-- Arrow Group 1 → Group 2 -->
  <line x1="340" y1="290" x2="340" y2="306" marker-end="url(#arrow)" stroke="rgb(156,154,146)" stroke-width="1.5" fill="none"/>

  <!-- ── Group 2: Output Structure ─────────────────────────── -->
  <g>
    <rect x="60" y="306" width="560" height="122" rx="8" stroke-width="0.5" fill="rgb(8,80,65)" stroke="rgb(93,202,165)"/>
    <text x="340" y="328" text-anchor="middle" dominant-baseline="central" fill="rgb(159,225,203)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="500">Output Structure — applied in this order</text>
    <text x="340" y="350" text-anchor="middle" dominant-baseline="central" fill="rgb(93,202,165)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">① Start with italic academic year header — *Academic Year: [value]*</text>
    <text x="340" y="370" text-anchor="middle" dominant-baseline="central" fill="rgb(93,202,165)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">② Present markdown table immediately (pipe syntax, header row, separator, one row per group)</text>
    <text x="340" y="388" text-anchor="middle" dominant-baseline="central" fill="rgb(72,170,138)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11">   Never write values inline like "Male: 5, Female: 9" — every value must be in its own cell</text>
    <text x="340" y="408" text-anchor="middle" dominant-baseline="central" fill="rgb(93,202,165)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">③ Add a narrative paragraph after the table. Always.</text>
  </g>

  <!-- Arrow Group 2 → Group 3 -->
  <line x1="340" y1="428" x2="340" y2="444" marker-end="url(#arrow)" stroke="rgb(156,154,146)" stroke-width="1.5" fill="none"/>

  <!-- ── Group 3: Format Constraints ───────────────────────── -->
  <g>
    <rect x="60" y="444" width="560" height="100" rx="8" stroke-width="0.5" fill="rgb(99,56,6)" stroke="rgb(239,159,39)"/>
    <text x="340" y="466" text-anchor="middle" dominant-baseline="central" fill="rgb(250,199,117)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="500">Format Constraints</text>
    <text x="340" y="486" text-anchor="middle" dominant-baseline="central" fill="rgb(239,159,39)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">Never open with a preamble or close with a summary remark</text>
    <text x="340" y="504" text-anchor="middle" dominant-baseline="central" fill="rgb(239,159,39)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">Use college abbreviations — CSM · COE · CCS · CHS · CASS · CEBA · CED</text>
    <text x="340" y="522" text-anchor="middle" dominant-baseline="central" fill="rgb(200,132,32)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-style="italic">Never expose internal field or collection names (student_enrollment, studgender, etc.)</text>
  </g>

  <!-- ── Legend ─────────────────────────────────────────────── -->
  <rect x="60"  y="566" width="14" height="14" rx="3" stroke-width="0.5" fill="rgb(60,52,137)"  stroke="rgb(175,169,236)"/>
  <text x="80"  y="574" dominant-baseline="central" fill="rgb(194,192,182)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">Data fidelity</text>

  <rect x="200" y="566" width="14" height="14" rx="3" stroke-width="0.5" fill="rgb(8,80,65)"    stroke="rgb(93,202,165)"/>
  <text x="220" y="574" dominant-baseline="central" fill="rgb(194,192,182)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">Output structure</text>

  <rect x="360" y="566" width="14" height="14" rx="3" stroke-width="0.5" fill="rgb(99,56,6)"    stroke="rgb(239,159,39)"/>
  <text x="380" y="574" dominant-baseline="central" fill="rgb(194,192,182)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">Format constraints / instruction source</text>

</svg>
